<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <meta content="THE MARKETS restaurant staff dashboard" name="description"/>
    <title>Add food item | THE MARKETS</title>
    <link href="../../css/main.css" rel="stylesheet"/>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="dashboard-sidebar">
            <a class="brand" href="../../index.html">
                <span class="brand-mark">TM</span>
                <span>THE MARKETS</span>
            </a>
        <nav aria-label="Restaurant staff navigation" class="dashboard-sidebar__nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="restaurant.html">Restaurant</a>
            <a href="menu.html">Menu</a>
            <a href="categories.html">Categories</a>
            <a aria-current="page" href="food-items.html">Food Items</a>
            <a href="availability.html">Availability</a>
            <a href="orders.html">Orders</a>
            <a href="inventory.html">Inventory</a>
            <a href="offers.html">Offers</a>
            <a href="reviews.html">Reviews</a>
            <a href="customers.html">Customers</a>
            <a href="analytics.html">Analytics</a>
            <a href="notifications.html">Notifications</a>
            <a href="settings.html">Settings</a>
            <a href="profile.html">Profile</a>
            <a class="js-logout" href="../public/login.html">Logout</a>
        </nav>
    </aside>

    <main class="dashboard-main">
        <header class="dashboard-topbar">
            <div>
                <p class="eyebrow">Restaurant workspace</p>
                <h1>Add food item</h1>
            </div>

            <div class="cluster">
                <span class="badge badge--success">● The Spice Route · Open</span>
                <a aria-label="Notifications" class="icon-button" href="notifications.html">🔔</a>
                <a class="btn btn--outline btn--sm" href="profile.html">Manager</a>
            </div>
        </header>

        <div class="dashboard-content">
            <form action="food-items.html" class="surface form-grid">
                <h2>New menu item</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="food-name">
                            Food name
                        </label>
                        <input
                            class="form-control"
                            id="food-name"
                            name="foodName"
                            required=""
                        />
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="food-category">
                            Category
                        </label>
                        <select
                            class="form-control"
                            id="food-category"
                            name="category"
                        >
                            <option>Main Course</option>
                            <option>Starters</option>
                            <option>Biryani</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="food-description">
                        Description
                    </label>
                    <textarea
                        class="form-control"
                        id="food-description"
                        name="description"
                        rows="3"
                    ></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="food-price">
                            Price
                        </label>
                        <input
                            class="form-control"
                            id="food-price"
                            name="price"
                            required=""
                            type="number"
                        />
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="food-discount">
                            Discount
                        </label>
                        <input
                            class="form-control"
                            id="food-discount"
                            name="discount"
                            type="number"
                        />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="food-type">
                            Food type
                        </label>
                        <select
                            class="form-control"
                            id="food-type"
                            name="foodType"
                        >
                            <option>Vegetarian</option>
                            <option>Non-vegetarian</option>
                            <option>Egg</option>
                            <option>Vegan</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="prep-time">
                            Preparation time (minutes)
                        </label>
                        <input
                            class="form-control"
                            id="prep-time"
                            name="preparationTime"
                            type="number"
                        />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="ingredients">
                            Ingredients
                        </label>
                        <input
                            class="form-control"
                            id="ingredients"
                            name="ingredients"
                        />
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="calories">
                            Calories
                        </label>
                        <input
                            class="form-control"
                            id="calories"
                            name="calories"
                            type="number"
                        />
                    </div>
                </div>

                <label class="form-check">
                    <input checked="" name="available" type="checkbox"/>
                    Available today
                </label>

                <div class="form-group">
                    <label class="form-label" for="food-image">
                        Food image
                    </label>
                    <input
                        class="form-control"
                        id="food-image"
                        name="image"
                        type="file"
                    />
                </div>

                <div class="cluster">
                    <button class="btn btn--primary" type="submit">
                        Save food
                    </button>
                    <a class="btn btn--outline" href="food-items.html">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </main>
</div>

<script defer="True" src="../../js/app.js"></script>
</body>
</html>
